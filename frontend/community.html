<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Идеи · Портфели сообщества</title><link rel="stylesheet" href="/static/design-system.css">
<link rel="stylesheet" href="/static/v2.css"><link rel="stylesheet" href="/static/account.css"><link rel="stylesheet" href="/static/community.css"><link rel="stylesheet" href="/static/interactions.css?v=20261116-1">
</head>
<body class="cabinet community-page"><header class="cab-header"><a href="/account" class="cab-brand"><span class="cab-logo">т</span>Портфель с агентом <span class="cab-beta">PREMARKET</span></a><div class="cab-header-right"><span class="cab-study"><i></i>Демо</span><a class="cab-avatar" href="/account" aria-label="Мой аккаунт">Я</a></div></header>
<main class="cm-main"><section class="cm-hero"><div><span class="cab-eyebrow">ПОРТФЕЛИ СООБЩЕСТВА</span><h1>Найдите свой подход<span>.</span></h1><p>Возьмите за основу чужой портфель.</p></div><div class="cm-hero-art" aria-hidden="true"><span id="cm-hero-icon"></span><span class="cm-orbit one"></span><span class="cm-orbit two"></span></div></section>
<section class="cm-catalog"><div class="cm-browse-top"><div class="cm-tabs"><h2 class="cm-catalog-title">Портфели <span id="cm-portfolio-count"></span></h2></div><label class="cm-search"><span class="sr">Поиск идей</span><input id="cm-search" placeholder="Найти стратегию или автора"></label></div><div class="cm-filter-row"><div class="cm-filters" role="group" aria-label="Уровень риска"><button data-cm-risk="all" class="on" aria-pressed="true">Все идеи</button><button data-cm-risk="low" aria-pressed="false">Низкий риск</button><button data-cm-risk="moderate" aria-pressed="false">Умеренный</button><button data-cm-risk="high" aria-pressed="false">Высокий</button></div><span id="cm-result-count"></span></div><p id="cm-error" role="alert" class="cab-form-error" hidden></p><div id="cm-grid" class="cm-grid" aria-live="polite"><div class="cab-skeleton"></div><div class="cab-skeleton"></div><div class="cab-skeleton"></div></div></section></main>
<dialog id="cm-detail" class="cab-dialog cm-detail" aria-labelledby="cm-detail-title"><div id="cm-detail-content"></div></dialog>
<dialog id="cm-use-dialog" class="cab-dialog" aria-labelledby="cm-use-title"><form id="cm-use-form"><div class="cab-dialog-top"><div><span class="cab-eyebrow">НОВЫЙ ПОРТФЕЛЬ</span><h2 id="cm-use-title">Сделать своим</h2></div><button type="button" class="cab-icon-button" data-cm-close="cm-use-dialog" aria-label="Закрыть">✕</button></div><div id="cm-selection" class="cm-selection"></div><label>Название портфеля<input id="cm-new-title" maxlength="80" required></label><label>Сумма, ₽<input id="cm-amount" type="number" min="10000" max="10000000000" step="1000" value="250000" required></label><div class="cab-origin-choice cm-use-modes"><label><input type="radio" name="cm-mode" value="manual" checked><span><b>Самостоятельно</b></span></label><label><input type="radio" name="cm-mode" value="agent"><span><b>С агентом</b></span></label></div><p id="cm-use-error" class="cab-form-error" role="alert" hidden></p><button id="cm-use-submit" class="cab-btn cab-btn-primary" type="submit">Создать мой портфель</button></form></dialog>
<dialog id="cm-add-dialog" class="cab-dialog" aria-labelledby="cm-add-title"><form id="cm-add-form"><div class="cab-dialog-top"><h2 id="cm-add-title">Добавить к своему портфелю</h2><button type="button" class="cab-icon-button" data-cm-close="cm-add-dialog" aria-label="Закрыть">✕</button></div><div id="cm-add-selection" class="cm-selection"></div><label>В какой портфель<select id="cm-own-portfolios" required></select></label><label>Что хотите обсудить<textarea id="cm-add-question" rows="3">Как адаптировать эту идею к моему портфелю?</textarea></label><p id="cm-add-error" class="cab-form-error" role="alert" hidden></p><button id="cm-add-submit" class="cab-btn cab-btn-primary">Обсудить с моим агентом →</button></form></dialog>
<script src="/static/cabinet.js?v=20261116-1"></script><script src="/static/community.js"></script><script src="/static/interactions.js?v=20261116-1"></script>
